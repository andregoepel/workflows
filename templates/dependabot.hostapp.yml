version: 2
updates:
  # NuGet dependencies (versions are centrally managed in Directory.Packages.props).
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — keep SHA-pinned actions and reusable workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Docker — keep tag@sha256 base-image references current through reviewed PRs.
  - package-ecosystem: docker
    directory: "/{{DOCKERFILE_DIRECTORY}}"
    schedule:
      interval: weekly
