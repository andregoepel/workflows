name: Docker Image CI

on:
  workflow_call:
    inputs:
      image:
        description: 'Fully-qualified image name, e.g. "ghcr.io/OWNER/REPO". Callers must pass this explicitly rather than relying on a computed default, since org slugs with uppercase letters (ghcr.io requires lowercase) need an explicit override.'
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile to build"
        type: string
        required: true
      context:
        description: "Docker build context"
        type: string
        default: "."
    outputs:
      digest:
        description: "Immutable manifest digest of the image pushed by this workflow"
        value: ${{ jobs.build.outputs.digest }}

# Actions are pinned to commit SHAs (not mutable tags) so a retagged or
# compromised action version cannot silently enter the pipeline. The trailing
# comment records the human-readable version each SHA corresponds to.
jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write # push to GitHub Container Registry via the built-in GITHUB_TOKEN

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only publish from main; pull requests build the image but do not push.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push the Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ inputs.image }}:${{ github.sha }}
            ${{ inputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image digest
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published $IMAGE@$DIGEST"
