name: Verified main image

on:
  workflow_call:
    inputs:
      app-id:
        description: "Stable application identity"
        type: string
        required: true
      source-repository:
        description: "Exact owner/repository spelling of the caller"
        type: string
        required: true
      source-repository-id:
        description: "Numeric GitHub repository ID, encoded as a string"
        type: string
        required: true
      build-workflow-path:
        description: "Caller workflow path, such as .github/workflows/build-main.yml"
        type: string
        required: true
      build-workflow-id:
        description: "Numeric caller workflow ID, encoded as a string"
        type: string
        required: true
      gates:
        description: 'JSON object of mandatory gates: {"ci":{"path":".github/workflows/ci.yml","id":3001}}'
        type: string
        required: true
      image:
        description: "Lowercase GHCR image repository under the source owner"
        type: string
        required: true
      dockerfile:
        description: "Source-relative Dockerfile path (no leading ./)"
        type: string
        required: true
      context:
        description: "Source-relative local build directory"
        type: string
        default: "."
    outputs:
      digest:
        description: "Verified immutable image manifest digest"
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Verified GHCR repository@sha256 reference"
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    concurrency:
      group: verified-main-image-${{ inputs.image }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.produce.outputs.digest }}
      image: ${{ steps.produce.outputs.image }}
    steps:
      # job.workflow_* identifies the called workflow's exact source revision,
      # whereas github.* continues to describe the caller. GitHub.com only.
      # Parse the documented job JSON because actionlint 1.7.12 predates these
      # fields. Missing fields fail here rather than falling back to caller code.
      - name: Resolve the called workflow identity
        id: producer-source
        env:
          JOB_IDENTITY: ${{ toJSON(job) }}
        run: |
          python3 -I - <<'PY'
          import json, os, re
          job = json.loads(os.environ["JOB_IDENTITY"])
          assert job["workflow_repository"] == "andregoepel/workflows"
          assert re.fullmatch(r"[0-9a-f]{40}", job["workflow_sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sha=" + job["workflow_sha"] + "\n")
          PY

      - name: Check out the pinned producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andregoepel/workflows
          ref: ${{ steps.producer-source.outputs.sha }}
          path: producer
          persist-credentials: false

      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate only to the image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify gates, build or reuse, and emit evidence
        id: produce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APP_ID: ${{ inputs.app-id }}
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          INPUT_SOURCE_REPOSITORY_ID: ${{ inputs.source-repository-id }}
          INPUT_BUILD_WORKFLOW_PATH: ${{ inputs.build-workflow-path }}
          INPUT_BUILD_WORKFLOW_ID: ${{ inputs.build-workflow-id }}
          INPUT_GATES: ${{ inputs.gates }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_CONTEXT: ${{ inputs.context }}
        run: python3 -I -B "$GITHUB_WORKSPACE/producer/tools/verified_build.py"

      - name: Upload the single bounded generation-2 document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-manifest-v2
          path: ${{ runner.temp }}/deployment-manifest-v2/deployment-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
