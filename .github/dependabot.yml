version: 2
updates:
  # Action and workflow pins remain reviewed commit SHAs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # The isolated Sonar console tool has its own central package manifest and locks.
  # SDK, scanner/coverage contracts and consumer pins still need coordinated review.
  - package-ecosystem: nuget
    directory: "/sonar"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sonar-compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
